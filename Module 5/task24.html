
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Tokens Demo</title>
    <style>
/* Task 24: CSS Design Tokens */

.container {
    --primary-color: #17324d;
    --accent-color: #087e8b;
    --background-color: #f2f6fa;
    --card-color: #ffffff;
    --text-color: #344054;

    --heading-size: 28px;
    --subheading-size: 21px;
    --body-size: 16px;

    max-width: 800px;
    margin: 30px auto;
    padding: 25px;
    background-color: var(--background-color);
    color: var(--text-color);
    font-family: Arial, sans-serif;
}

.container header {
    background-color: var(--primary-color);
    color: var(--card-color);
    text-align: center;
    padding: 20px;
}

.container h1 {
    font-size: var(--heading-size);
}

.container h2 {
    color: var(--accent-color);
    font-size: var(--subheading-size);
}

.container p,
.container li {
    font-size: var(--body-size);
    line-height: 1.6;
}

.container section {
    background-color: var(--card-color);
    padding: 15px;
    margin-top: 15px;
}

.container a {
    color: var(--accent-color);
}

.container footer {
    background-color: var(--primary-color);
    color: var(--card-color);
    text-align: center;
    padding: 10px;
    margin-top: 15px;
}
</style>
</head>
<body>

    <div class="container">
        <header>
            <h1>My Design System</h1>
            <p>Learning CSS Variables</p>
        </header>

        <section>
            <h2>About Design Tokens</h2>
            <p>
                Design tokens help us reuse the same colours
                and font sizes throughout a website.
            </p>
            <a href="https://github.com/DeekshaaSharmaa">Visit GitHub</a>
        </section>

        <section>
            <h2>My Skills</h2>
            <ul>
                <li>Java</li>
                <li>Python</li>
                <li>HTML and CSS</li>
            </ul>
        </section>

        <footer>
            <p>Created by Deeksha Sharma | 2026</p>
        </footer>
    </div>

</body>
</html>
