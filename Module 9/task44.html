
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Landing Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Header */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: lightblue;
            padding: 15px 30px;
        }

        .navbar h2 {
            margin: 0;
        }

        .menu {
            display: flex;
            gap: 20px;
        }

        .menu a {
            text-decoration: none;
            color: black;
        }

        /* Hero Section */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            padding: 50px 30px;
            background-color: white;
        }

        .hero-text {
            flex: 1;
        }

        .hero-image {
            flex: 1;
            text-align: center;
        }

        .hero-image img {
            width: 100%;
            max-width: 300px;
        }

        .hero button {
            padding: 10px 18px;
            background-color: lightblue;
            border: 1px solid gray;
        }

        /* Course Section */
        .courses {
            padding: 30px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .course {
            background-color: white;
            border: 1px solid #cccccc;
            padding: 20px;
        }

        /* Footer */
        footer {
            background-color: lightblue;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>LearnSpace</h2>

        <div class="menu">
            <a href="#home">Home</a>
            <a href="#courses">Courses</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <main>
        <section class="hero" id="home">
            <div class="hero-text">
                <h1>Learn Something New</h1>
                <p>
                    Welcome to my learning website.
                    Explore basic programming and web development.
                </p>
                <button>Explore Courses</button>
            </div>

            <div class="hero-image">
                <img
                    src="https://placehold.co/300x200?text=Learning"
                    alt="Learning illustration"
                >
            </div>
        </section>

        <section class="courses" id="courses">
            <h2>Our Courses</h2>

            <div class="course-grid">
                <div class="course">
                    <h3>HTML</h3>
                    <p>Learn webpage structure.</p>
                </div>

                <div class="course">
                    <h3>CSS</h3>
                    <p>Learn webpage styling.</p>
                </div>

                <div class="course">
                    <h3>Java</h3>
                    <p>Learn programming basics.</p>
                </div>
            </div>
        </section>
    </main>

    <footer id="contact">
        <p>LearnSpace - My Landing Page Project</p>
    </footer>

</body>
</html>
