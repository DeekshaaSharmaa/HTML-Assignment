
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333333;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 25px auto;
        }

        .product {
            background-color: white;
            border: 1px solid #cccccc;
            padding: 15px;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .product h3 {
            margin: 10px 0;
        }

        .product p {
            color: #444444;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="products">

        <div class="product">
            <img src="https://placehold.co/300x200?text=Backpack" alt="Backpack">
            <h3>Backpack</h3>
            <p>Price: ₹599</p>
        </div>

        <div class="product">
            <img src="https://placehold.co/300x200?text=Notebook" alt="Notebook">
            <h3>Notebook</h3>
            <p>Price: ₹80</p>
        </div>

        <div class="product">
            <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
            <h3>Headphones</h3>
            <p>Price: ₹499</p>
        </div>

        <div class="product">
            <img src="https://placehold.co/300x200?text=Watch" alt="Watch">
            <h3>Watch</h3>
            <p>Price: ₹799</p>
        </div>

    </div>

</body>
</html>
