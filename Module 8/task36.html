
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: 20px auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 1px solid #cccccc;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">
        <img src="https://picsum.photos/id/1015/400/300" alt="Mountain and river">
        <img src="https://picsum.photos/id/1025/400/300" alt="Dog portrait">
        <img src="https://picsum.photos/id/1039/400/300" alt="Mountain landscape">
        <img src="https://picsum.photos/id/106/400/300" alt="Nature scene">
        <img src="https://picsum.photos/id/1043/400/300" alt="Green landscape">
        <img src="https://picsum.photos/id/1050/400/300" alt="Forest view">
    </div>

</body>
</html>
