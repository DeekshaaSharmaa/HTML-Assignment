
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Header */
        .header {
            background-color: lightblue;
            padding: 15px 25px;
        }

        .header h2 {
            margin: 0;
        }

        /* Main layout */
        .layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            padding: 20px;
        }

        /* Sidebar */
        .sidebar {
            background-color: white;
            border: 1px solid #cccccc;
            padding: 15px;
        }

        .sidebar p {
            margin: 20px 0;
        }

        /* Products */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .product {
            background-color: white;
            border: 1px solid #cccccc;
            padding: 12px;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        .product h3 {
            margin: 10px 0;
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                padding: 10px;
            }

            .sidebar p {
                display: inline-block;
                margin: 10px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h2>My Product Store</h2>
    </header>

    <div class="layout">

        <aside class="sidebar">
            <h3>Categories</h3>
            <p>Bags</p>
            <p>Books</p>
            <p>Electronics</p>
            <p>Accessories</p>
        </aside>

        <main class="products">

            <div class="product">
                <img src="https://placehold.co/300x200?text=Backpack" alt="Backpack">
                <h3>Backpack</h3>
                <p>Price: ₹599</p>
            </div>

            <div class="product">
                <img src="https://placehold.co/300x200?text=Notebook" alt="Notebook">
                <h3>Notebook</h3>
                <p>Price: ₹80</p>
            </div>

            <div class="product">
                <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
                <h3>Headphones</h3>
                <p>Price: ₹499</p>
            </div>

            <div class="product">
                <img src="https://placehold.co/300x200?text=Watch" alt="Watch">
                <h3>Watch</h3>
                <p>Price: ₹799</p>
            </div>

        </main>

    </div>

</body>
</html>
