
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Landing Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: lightblue;
            padding: 15px 25px;
        }

        .navbar h2 {
            margin: 0;
        }

        .menu {
            display: flex;
            gap: 20px;
        }

        .menu a {
            text-decoration: none;
            color: black;
        }

        /* Hero Section */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 40px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-image {
            flex: 1;
            text-align: center;
        }

        .hero-image img {
            width: 100%;
            max-width: 300px;
        }

        .hero button {
            padding: 10px 18px;
            background-color: lightblue;
            border: 1px solid gray;
            cursor: pointer;
        }

        /* For smaller screens */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>My Website</h2>

        <div class="menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <div class="hero-text">
            <h1>Welcome to My Website</h1>

            <p id="about">
                Hello! I am a BCA Artificial Intelligence student.
                I am learning HTML and CSS to create simple and useful websites.
            </p>

            <button onclick="document.getElementById('contact').scrollIntoView()">
                Contact Me
            </button>
        </div>

        <div class="hero-image">
            <img
                src="https://placehold.co/300x200?text=My+Website"
                alt="Website placeholder"
            >
        </div>
    </section>

    <footer id="contact" style="text-align:center; padding:20px;">
        <p>Contact: student@example.com</p>
        <p>My First Flexbox Landing Page</p>
    </footer>

</body>
</html>
