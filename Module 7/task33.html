
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        h1 {
            text-align: center;
            margin: 25px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .product {
            background-color: rgb(206, 189, 236);
            width: 200px;
            padding: 15px;
            border: 1px solid #ccc;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }

        .product button {
            background-color: lightblue;
            border: 1px solid #888;
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>My Products</h1>

    <div class="container">

        <div class="product">
            <img src="https://placehold.co/200x130?text=Bag" alt="Bag">
            <h3>College Bag</h3>
            <p>Price: ₹600</p>
            <button>View Product</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/200x130?text=Notebook" alt="Notebook">
            <h3>Notebook</h3>
            <p>Price: ₹80</p>
            <button>View Product</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/200x130?text=Headphones" alt="Headphones">
            <h3>Headphones</h3>
            <p>Price: ₹500</p>
            <button>View Product</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/200x130?text=Watch" alt="Watch">
            <h3>Watch</h3>
            <p>Price: ₹400</p>
            <button>View Product</button>
        </div>

    </div>

</body>
</html>
