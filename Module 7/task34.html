
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar and Hero</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: lightblue;
            padding: 15px 25px;
        }

        .navbar h2 {
            margin: 0;
        }

        .menu {
            display: flex;
            gap: 20px;
        }

        .menu a {
            text-decoration: none;
            color: black;
        }

        /* Hero section */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
            gap: 20px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            color: navy;
        }

        .hero-text p {
            line-height: 1.6;
        }

        .hero-image {
            flex: 1;
            text-align: center;
        }

        .hero-image img {
            width: 100%;
            max-width: 300px;
        }

        button {
            background-color: lightblue;
            padding: 10px 15px;
            border: 1px solid gray;
            cursor: pointer;
        }

        /* Small screen */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>My Website</h2>

        <div class="menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="home">

        <div class="hero-text">
            <h1>Welcome to My Website</h1>

            <p>
                I am a BCA Artificial Intelligence student.
                I am learning HTML and CSS to create
                simple and useful websites.
            </p>

            <button>Learn More</button>
        </div>

        <div class="hero-image">
            <img src="https://placehold.co/300x200?text=My+Website"
                 alt="Website illustration">
        </div>

    </section>

</body>
</html>
